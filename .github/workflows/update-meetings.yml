name: Update school committee meetings

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-committee-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official meeting sources
        run: python scripts/update_meetings.py
      - name: Commit changed source state and snapshots
        run: |
          git config user.name "edbeatwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_state.json archive/source-snapshots/
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Update school committee source snapshots"
            git push
          fi
